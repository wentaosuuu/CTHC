<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA3E8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#52C41A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#73D13D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FA8C16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA940;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="550" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">合同变更流程图</text>
  
  <!-- ========== 续签流程 ========== -->
  <text x="220" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1890FF">【续签流程】</text>
  
  <!-- 原合同 -->
  <rect x="50" y="85" width="140" height="50" rx="8" fill="url(#gradGreen)" stroke="#389E0D" stroke-width="2"/>
  <text x="120" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">原合同</text>
  <text x="120" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">(ACTIVE)</text>
  
  <line x1="190" y1="110" x2="240" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 创建续签合同 -->
  <rect x="240" y="85" width="140" height="50" rx="8" fill="url(#gradBlue)" stroke="#2E7AD1" stroke-width="2"/>
  <text x="310" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">创建续签合同</text>
  
  <line x1="380" y1="110" x2="430" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 新合同 -->
  <rect x="430" y="85" width="140" height="50" rx="8" fill="url(#gradGreen)" stroke="#389E0D" stroke-width="2"/>
  <text x="500" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">新合同</text>
  <text x="500" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">(ACTIVE)</text>
  
  <!-- 原合同变更 -->
  <line x1="310" y1="135" x2="310" y2="165" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="310" y1="165" x2="120" y2="165" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="120" y1="135" x2="120" y2="165" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="215" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999">原合同状态变更为 TERMINATED</text>
  
  <!-- ========== 换房流程 ========== -->
  <text x="220" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FA8C16">【换房流程】</text>
  
  <!-- 旧合同 -->
  <rect x="50" y="240" width="120" height="50" rx="8" fill="url(#gradGreen)" stroke="#389E0D" stroke-width="2"/>
  <text x="110" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">旧合同</text>
  <text x="110" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">(ACTIVE)</text>
  
  <line x1="170" y1="265" x2="210" y2="265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 终止旧合同 -->
  <rect x="210" y="240" width="120" height="50" rx="8" fill="url(#gradOrange)" stroke="#D46B08" stroke-width="2"/>
  <text x="270" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">终止旧合同</text>
  
  <line x1="330" y1="265" x2="370" y2="265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 创建新房合同 -->
  <rect x="370" y="240" width="120" height="50" rx="8" fill="url(#gradBlue)" stroke="#2E7AD1" stroke-width="2"/>
  <text x="430" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">创建新房合同</text>
  
  <line x1="490" y1="265" x2="530" y2="265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 新合同 -->
  <rect x="530" y="240" width="120" height="50" rx="8" fill="url(#gradGreen)" stroke="#389E0D" stroke-width="2"/>
  <text x="590" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">新合同</text>
  <text x="590" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">(ACTIVE)</text>
  
  <!-- 旧房源释放 -->
  <line x1="270" y1="290" x2="270" y2="320" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="110" y1="320" x2="270" y2="320" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="110" y1="290" x2="110" y2="320" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="190" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999">旧房源状态恢复为 VACANT</text>
  
  <!-- ========== 合同终止流程 ========== -->
  <text x="220" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F5222D">【合同终止流程】</text>
  
  <!-- 生效中合同 -->
  <rect x="50" y="395" width="140" height="50" rx="8" fill="url(#gradGreen)" stroke="#389E0D" stroke-width="2"/>
  <text x="120" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">生效中合同</text>
  <text x="120" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">(ACTIVE)</text>
  
  <line x1="190" y1="420" x2="240" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 店长发起终止 -->
  <rect x="240" y="395" width="140" height="50" rx="8" fill="url(#gradOrange)" stroke="#D46B08" stroke-width="2"/>
  <text x="310" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">店长发起终止</text>
  
  <line x1="380" y1="420" x2="430" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 合同终止 -->
  <rect x="430" y="395" width="140" height="50" rx="8" fill="#FFF1F0" stroke="#FF4D4F" stroke-width="2"/>
  <text x="500" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#CF1322">合同终止</text>
  <text x="500" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#CF1322">(TERMINATED)</text>
  
  <line x1="570" y1="420" x2="620" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 房源释放 -->
  <rect x="620" y="395" width="140" height="50" rx="8" fill="#F6FFED" stroke="#52C41A" stroke-width="2"/>
  <text x="690" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#389E0D">房源状态恢复</text>
  
  <!-- 说明框 -->
  <rect x="50" y="470" width="800" height="65" rx="8" fill="#FFF7E6" stroke="#FFD591" stroke-width="1"/>
  <text x="70" y="495" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FA8C16">变更规则说明：</text>
  <text x="70" y="515" font-family="Arial, sans-serif" font-size="11" fill="#333">• 续签：原合同与新合同建立关联关系（renewedFrom/renewedTo），原合同状态变更为TERMINATED，新合同继承原租客信息</text>
  <text x="70" y="530" font-family="Arial, sans-serif" font-size="11" fill="#333">• 换房：旧合同终止后释放原房源，新合同关联到新房源，建立changeHouseFrom关联关系</text>
</svg>