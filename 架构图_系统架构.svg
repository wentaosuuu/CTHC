<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD"/>
      <stop offset="100%" style="stop-color:#BBDEFB"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9"/>
      <stop offset="100%" style="stop-color:#C8E6C9"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="600" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">CTHC 系统架构图</text>
  
  <!-- ========== 用户层 ========== -->
  <rect x="50" y="60" width="800" height="80" rx="8" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="2"/>
  <text x="450" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#616161">用户层</text>
  
  <!-- 系统管理员 -->
  <rect x="80" y="95" width="140" height="35" rx="6" fill="url(#frontendGrad)" stroke="#1976D2" stroke-width="2"/>
  <text x="150" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">系统管理员</text>
  
  <!-- 店长 -->
  <rect x="260" y="95" width="140" height="35" rx="6" fill="url(#frontendGrad)" stroke="#1976D2" stroke-width="2"/>
  <text x="330" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">店长</text>
  
  <!-- 租客 -->
  <rect x="500" y="95" width="140" height="35" rx="6" fill="url(#frontendGrad)" stroke="#1976D2" stroke-width="2"/>
  <text x="570" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">租客</text>
  
  <!-- 住建局 -->
  <rect x="680" y="95" width="140" height="35" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="750" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">住建局（外部）</text>
  
  <!-- ========== 前端层 ========== -->
  <rect x="50" y="160" width="800" height="120" rx="8" fill="url(#frontendGrad)" stroke="#1976D2" stroke-width="2"/>
  <text x="450" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565C0">前端层</text>
  
  <!-- Admin 管理后台 -->
  <rect x="80" y="200" width="200" height="65" rx="6" fill="white" stroke="#1976D2" stroke-width="2"/>
  <text x="180" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1976D2">Admin 管理后台</text>
  <text x="180" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">React 19 + Vite 7</text>
  <text x="180" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">React Router 6 + Recharts</text>
  
  <!-- H5 移动端 -->
  <rect x="350" y="200" width="200" height="65" rx="6" fill="white" stroke="#1976D2" stroke-width="2"/>
  <text x="450" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1976D2">Mobile H5 租客端</text>
  <text x="450" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">React 19 + Vite 7</text>
  <text x="450" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">移动端适配 + 地图组件</text>
  
  <!-- 连接箭头 -->
  <line x1="150" y1="130" x2="180" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="330" y1="130" x2="250" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="130" x2="450" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- ========== API 网关层 ========== -->
  <rect x="50" y="300" width="800" height="60" rx="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="2"/>
  <text x="450" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3F51B5">API 网关层</text>
  <text x="450" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">RESTful API / JWT 认证 / 权限控制 / 请求限流</text>
  
  <!-- 连接箭头 -->
  <line x1="180" y1="265" x2="350" y2="300" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="265" x2="450" y2="300" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- ========== 后端服务层 ========== -->
  <rect x="50" y="380" width="800" height="140" rx="8" fill="url(#backendGrad)" stroke="#388E3C" stroke-width="2"/>
  <text x="450" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">后端服务层</text>
  
  <!-- Server -->
  <rect x="80" y="420" width="180" height="85" rx="6" fill="white" stroke="#388E3C" stroke-width="2"/>
  <text x="170" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#388E3C">Server（Express）</text>
  <text x="170" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Node.js + Express 5</text>
  <text x="170" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">TypeScript + Zod 校验</text>
  <text x="170" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">bcryptjs + multer</text>
  
  <!-- Services -->
  <rect x="300" y="420" width="180" height="85" rx="6" fill="white" stroke="#388E3C" stroke-width="2"/>
  <text x="390" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#388E3C">业务服务层</text>
  <text x="390" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">账单导入服务</text>
  <text x="390" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">住建报备服务</text>
  <text x="390" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">滞纳金计算服务</text>
  
  <!-- Schedulers -->
  <rect x="520" y="420" width="180" height="85" rx="6" fill="white" stroke="#388E3C" stroke-width="2"/>
  <text x="610" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#388E3C">定时任务</text>
  <text x="610" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">node-cron</text>
  <text x="610" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">合同过期处理（10分钟）</text>
  <text x="610" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">住建报备（每天2点）</text>
  
  <!-- 连接箭头 -->
  <line x1="450" y1="360" x2="170" y2="420" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- ========== 数据层 ========== -->
  <rect x="50" y="540" width="800" height="45" rx="8" fill="url(#dataGrad)" stroke="#F57C00" stroke-width="2"/>
  <text x="120" y="568" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E65100">数据层：</text>
  <text x="190" y="568" font-family="Arial, sans-serif" font-size="11" fill="#333">SQLite（开发环境）</text>
  <text x="330" y="568" font-family="Arial, sans-serif" font-size="11" fill="#333">|</text>
  <text x="350" y="568" font-family="Arial, sans-serif" font-size="11" fill="#333">Prisma ORM 6.16</text>
  <text x="480" y="568" font-family="Arial, sans-serif" font-size="11" fill="#333">|</text>
  <text x="500" y="568" font-family="Arial, sans-serif" font-size="11" fill="#333">文件存储（合同附件/账单凭证）</text>
  
  <!-- 连接箭头 -->
  <line x1="170" y1="505" x2="170" y2="540" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="505" x2="390" y2="540" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="505" x2="610" y2="540" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- 外部系统箭头 -->
  <line x1="750" y1="130" x2="750" y2="540" stroke="#C62828" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="760" y="340" font-family="Arial, sans-serif" font-size="10" fill="#C62828" transform="rotate(90, 760, 340)">住建报备接口（模拟）</text>
</svg>