<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="850" height="500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA3E8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#52C41A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#73D13D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FA8C16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA940;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="850" height="500" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="425" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">账单处理流程图</text>
  
  <!-- 合同生效 -->
  <rect x="365" y="55" width="120" height="45" rx="8" fill="url(#gradGreen)" stroke="#389E0D" stroke-width="2"/>
  <text x="425" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">合同生效</text>
  
  <!-- 下行箭头 -->
  <line x1="425" y1="100" x2="425" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 预生成基础账单 -->
  <rect x="315" y="130" width="220" height="50" rx="8" fill="url(#gradBlue)" stroke="#2E7AD1" stroke-width="2"/>
  <text x="425" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">预生成基础账单（BASE）</text>
  <text x="425" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E6F7FF">租金、押金、固定费用</text>
  
  <!-- 下行箭头 -->
  <line x1="425" y1="180" x2="425" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 管理员导入实际费用 -->
  <rect x="300" y="210" width="250" height="50" rx="8" fill="url(#gradOrange)" stroke="#D46B08" stroke-width="2"/>
  <text x="425" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">管理员导入实际费用</text>
  <text x="425" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFF7E6">水费、电费、物业费等变动费用</text>
  
  <!-- 分支箭头 -->
  <line x1="425" y1="260" x2="425" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 生成补缴账单 -->
  <rect x="315" y="290" width="220" height="45" rx="8" fill="#FFF7E6" stroke="#FA8C16" stroke-width="2"/>
  <text x="425" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D46B08">生成补缴账单（ADJUSTMENT）</text>
  
  <!-- 支付分支 -->
  <line x1="315" y1="312" x2="180" y2="312" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="535" y1="312" x2="670" y2="312" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 在线支付 -->
  <rect x="50" y="285" width="130" height="50" rx="8" fill="url(#gradGreen)" stroke="#389E0D" stroke-width="2"/>
  <text x="115" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">租客在线支付</text>
  
  <!-- 线下核销 -->
  <rect x="670" y="285" width="130" height="50" rx="8" fill="#E6F7FF" stroke="#1890FF" stroke-width="2"/>
  <text x="735" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#096DD9">管理员线下核销</text>
  
  <!-- 汇聚箭头 -->
  <line x1="115" y1="335" x2="115" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="735" y1="335" x2="735" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="115" y1="370" x2="735" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="425" y1="370" x2="425" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 账单状态变更 -->
  <rect x="340" y="400" width="170" height="45" rx="8" fill="#F6FFED" stroke="#52C41A" stroke-width="2"/>
  <text x="425" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#389E0D">账单状态变更为 PAID</text>
  
  <!-- 说明框 -->
  <rect x="50" y="465" width="750" height="25" rx="4" fill="#F5F5F5" stroke="#D9D9D9" stroke-width="1"/>
  <text x="60" y="482" font-family="Arial, sans-serif" font-size="11" fill="#666">账期锁定：管理员可锁定已结算账期，锁定后该账期数据不可变更，保证财务数据一致性</text>
</svg>